steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lead-intel/api:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lead-intel/api:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lead-intel/api'

  # Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'db-migrate'
      - '--region=${_REGION}'
      - '--wait'

  # Deploy API
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lead-intel-api'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/lead-intel/api:$SHORT_SHA'
      - '--region=${_REGION}'

  # Deploy Worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lead-intel-worker'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/lead-intel/api:$SHORT_SHA'
      - '--region=${_REGION}'

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
